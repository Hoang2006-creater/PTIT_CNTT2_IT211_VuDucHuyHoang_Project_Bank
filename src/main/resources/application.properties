spring.application.name=IT211_Project

#Config datasource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_cntt2_bank?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234

#@Config jpa
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#Config logging    C?p ?? log: TRACE  -   DEBUG  -  INFO   -  WARN   -  ERROR
logging.file.name=logs/application.log
logging.pattern.console=%d{yyyy-MM-dd hh:mm:ss.SSS} -  %highlight(%-5level) - %cyan(%logger{50}) - %green(%msg%n)
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30
logging.level.root=INFO
logging.level.ra.demo = INFO

# JWT
jwt-secret=MySecretKeyForBankProject2026MySecretKey
jwt-expired=86400000
jwt-refresh-expired=604800000

